[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pwvault"
version = "0.1.0"
description = "Self-hosted password vault with QR-code sharing of single accounts"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pynacl>=1.5",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "qrcode>=7.4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
pwvault = "pwvault.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pwvault = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S101"]  # asserts are fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]  # tests use fake passwords on purpose

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
